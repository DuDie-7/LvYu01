<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}留言板{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            color: #1e293b;
            line-height: 1.5;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* 导航栏 */
        nav {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 0 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            padding: 18px 0;
            transition: 0.2s;
            display: inline-block;
            border-bottom: 2px solid transparent;
        }

        nav a:hover {
            color: white;
            border-bottom-color: #fbbf24;
        }

        .user-info {
            color: white;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-info span {
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            padding: 6px 16px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        /* 主内容区 */
        .main-content {
            padding: 32px 36px;
        }

        /* 标题 */
        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #0f172a;
            border-left: 5px solid #4f46e5;
            padding-left: 18px;
        }

        /* 闪存消息 */
        .flash {
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            font-weight: 500;
            background: #fef9c3;
            color: #854d0e;
            border-left: 5px solid #eab308;
        }
        .flash.success {
            background: #dcfce7;
            color: #166534;
            border-left-color: #22c55e;
        }
        .flash.danger {
            background: #fee2e2;
            color: #991b1b;
            border-left-color: #ef4444;
        }

        /* 留言卡片 */
        .message-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .message-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }
        .message-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .message-title a {
            color: #1e293b;
            text-decoration: none;
            transition: 0.2s;
        }
        .message-title a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }
        .message-meta {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 14px;
            display: flex;
            gap: 16px;
        }
        .message-summary {
            color: #334155;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .message-actions {
            display: flex;
            gap: 20px;
        }
        .message-actions a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
        }
        .message-actions a:hover {
            color: #7c3aed;
            text-decoration: underline;
        }

        /* 分页 */
        .pagination {
            margin-top: 30px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: baseline;
        }
        .pagination a, .pagination span {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            background: white;
            border: 1px solid #e2e8f0;
            color: #4f46e5;
            text-decoration: none;
            transition: 0.2s;
        }
        .pagination a:hover {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        .pagination .current {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 1rem;
            transition: 0.2s;
            font-family: inherit;
            background: #fefefe;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        button, .btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            text-decoration: none;
        }
        button:hover, .btn:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }
        hr {
            margin: 20px 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
        /* 详情页 */
        .detail-content {
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            white-space: pre-wrap;
            line-height: 1.7;
            margin: 20px 0;
        }
        /* 响应式 */
        @media (max-width: 700px) {
            .container {
                border-radius: 16px;
            }
            nav {
                flex-direction: column;
                padding: 12px 20px;
            }
            .nav-links, .user-info {
                width: 100%;
                justify-content: center;
            }
            .main-content {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 30px 20px; font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif; background: url('{{ url_for('static', filename='3.jpg') }}') no-repeat center center fixed; background-size: cover; color: #1e293b; line-height: 1.5;">
<div class="container" style="max-width: 1000px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); border-radius: 24px; box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1); overflow: hidden;">
    <nav style="background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 0 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
        <div class="nav-links" style="display: flex; gap: 28px; flex-wrap: wrap; align-items: center;">
            <a href="{{ url_for('message.index') }}" style="color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; padding: 18px 0; transition: 0.2s; border-bottom: 2px solid transparent;">🏠 首页</a>
            <a href="{{ url_for('message.add') }}" style="color: rgba(255,255,255,0.9); text-decoration: none; font-weight: 500; padding: 18px 0; transition: 0.2s; border-bottom: 2px solid transparent;">✍️ 发表留言</a>
        </div>
        {% if current_user.is_authenticated %}
        <div class="user-info" style="color: white; display: flex; align-items: center; gap: 18px;">
            <span style="background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 40px; font-size: 0.9rem;">👤 {{ current_user.username }}</span>
            <a href="{{ url_for('auth.change_password') }}" style="background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 40px; text-decoration: none; color: white;">🔧 修改密码</a>
            <a href="{{ url_for('auth.logout') }}" style="background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 40px; text-decoration: none; color: white;">🚪 登出</a>
        </div>
        {% endif %}
    </nav>
    <div class="main-content" style="padding: 32px 36px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" style="padding: 12px 20px; border-radius: 16px; margin-bottom: 24px; font-weight: 500; background: #fef9c3; color: #854d0e; border-left: 5px solid #eab308;">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
