{% extends "base.html" %}
{% block title %}登录 - 留言板{% endblock %}
{% block content %}
<div style="max-width: 450px; margin: 0 auto; background: rgba(255, 255, 255, 0.25); border-radius: 24px; padding: 30px 35px; box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2); backdrop-filter: blur(6px);">
    <h2 style="text-align: center; margin-top: 0; color: #1e293b; text-shadow: 0 1px 2px rgba(255,255,255,0.5);">🔐 登录</h2>
    <form method="post">
        <div class="form-group">
            <label style="font-weight: 600; text-shadow: 0 1px 1px rgba(255,255,255,0.5);">👤 用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required autofocus style="background: rgba(255,255,255,0.8);">
        </div>
        <div class="form-group">
            <label style="font-weight: 600; text-shadow: 0 1px 1px rgba(255,255,255,0.5);">🔒 密码</label>
            <input type="password" name="password" placeholder="请输入密码" required style="background: rgba(255,255,255,0.8);">
        </div>
        <button type="submit" style="width: 100%;">登录</button>
    </form>
    <div style="margin-top: 24px; padding: 12px; background: rgba(0,0,0,0.1); border-radius: 16px; text-align: center; font-size: 0.85rem; color: #1e293b; font-weight: 500; backdrop-filter: blur(2px);">
        💡 测试账号：<strong>admin</strong> / <strong>123456</strong><br>
        （任意用户名/密码也可自动创建新账号）
    </div>
</div>
{% endblock %}
