{% extends "base.html" %}
{% block title %}{{ msg.title }}{% endblock %}
{% block content %}
<h2>{{ msg.title }}</h2>
<p>作者：{{ msg.author.username }} | 发表时间：{{ msg.created_at.strftime('%Y-%m-%d %H:%M') }} | 最后编辑：{{ msg.updated_at.strftime('%Y-%m-%d %H:%M') }}</p>
<hr>
<p style="white-space: pre-wrap;">{{ msg.content }}</p>
<p><a href="{{ url_for('message.index') }}">返回列表</a></p>
{% endblock %}
